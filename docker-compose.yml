# Hardened deployment file. See docs/deployment.md.
# Required: BACKEND_SHARED_SECRET (set it in .env next to this file).
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # No `ports:` on purpose: only the frontend container reaches the backend,
    # over the compose network.
    volumes:
      - app-data:/data
    environment:
      - APP_ENV=production
      - API_SHARED_SECRET=${BACKEND_SHARED_SECRET:?BACKEND_SHARED_SECRET must be set (see docs/deployment.md)}
      - HIRISPLEX_MARKERS_PATH=/app/app/data/hrisplexs_id.txt
      - PLEX34_MARKERS_PATH=/app/app/data/plex34_id.txt
      - PLEX34_STRUCTURE_POPULATION_PATH=/app/app/data/plex34_structure/metapop_3202samples.csv
      - PLEX34_STRUCTURE_MAINPARAMS_PATH=/app/app/data/plex34_structure/mainparams
      - PLEX34_STRUCTURE_EXTRAPARAMS_PATH=/app/app/data/plex34_structure/extraparams
      - UPLOAD_DIR=/data/uploads
      - ARTIFACT_DIR=/data/artifacts
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:8080}
    networks:
      - hirisplex-network
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    environment:
      - BACKEND_SHARED_SECRET=${BACKEND_SHARED_SECRET:?BACKEND_SHARED_SECRET must be set (see docs/deployment.md)}
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hirisplex-network
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=32m
      # The image entrypoint renders the nginx template into conf.d at startup.
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  hirisplex-network:
    driver: bridge

volumes:
  app-data:
